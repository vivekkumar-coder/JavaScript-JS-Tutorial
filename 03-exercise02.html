<!DOCTYPE html>
<html>

<head>
  <title>Exercise of Variable</title>
</head>

<body>
  <script>
    let name = 'hello';
    console.log(name);
    name = `My name is : ${name}`;
    console.log(name);

    const cost = 5 + 2 * 3 + 9;
    console.log(`Cost of food: $${cost}`);

    const tax = cost * 0.1;
    console.log(`Tax(10%) : $${tax}`);

  </script>
</body>

</html>
