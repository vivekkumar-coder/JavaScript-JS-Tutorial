  <script>
    const hour = 10;

    if (hour >= 0 && hour <= 23) {

        console.log('Good night!');

    const age = 11;

      console.log('No discount');

    else if (!isHoliday) {
      console.log('Discount');
    }


    const randNumber = Math.random();
    let result = '';
    if (randNumber < 0.5) {
      result = 'head';
    } else {
      result = 'tail';
    }

    if (result == 'head') {
      console.log('You Win.');
