<!DOCTYPE html>
<html>

<head>
  <title>
    Rock Paper Scissors
  </title>
</head>

<body>
  <p>Rock Paper Scissors</p>

  <button onclick="
    playGame('rock');
  ">Rock</button>

  <button onclick="
    playGame('paper');
  ">Paper</button>

  <button onclick="
    playGame('Scissors');
  ">Scissors</button>


  <script>
    function playGame(playerMove) {
      const computerMove = pickComputerMove();

      let result = '';

      if (playerMove === 'Scissors') {
        if (computerMove === 'rock') {
          result = 'You lose';
        } else if (computerMove === 'paper') {
          result = 'You Win';
        } else if (computerMove === 'scissors') {
          result = 'Tie';
        }

      } else if (playerMove === 'paper') {
        if (computerMove === 'rock') {
          result = 'You win.'
        } else if (computerMove === 'Paper') {
          result = 'Tie.'
        } else if (computerMove === 'Scissors') {
          result = 'You lose.'
        }

      } else if (computerMove === 'rock') {
        if (computerMove === 'rock') {
          result = 'Tie.'
        } else if (computerMove === 'Paper') {
          result = 'You lose.'
        } else if (computerMove === 'Scissors') {
          result = 'You win.'
        }
      }

      alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
    }

    function pickComputerMove() {
      const randomNumber = Math.random();

      let computerMove = '';


      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
      } else if (randNumber >= 1 / 3 && randNumber < 1 / 3) {
        computerMove = 'paper';
      } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'scissor';
      }

      // return -- alone statement print undefined in console
      return computerMove;
    }
  </script>
</body>

</html>
